[project]
name = "rag-security-lab"
version = "0.3.0"
description = "A reproducible lab for RAG poisoning, indirect prompt injection, and policy enforcement."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rag-lab = "rag_lab.cli:main"

[tool.setuptools.packages.find]
include = ["rag_lab*"]
